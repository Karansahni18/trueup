name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: ci-only-not-a-real-password
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify