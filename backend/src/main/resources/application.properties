spring.application.name=trueup

# Optional: reads POSTGRES_PASSWORD from the repo-level .env file (when started from backend/)
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/trueup
spring.datasource.username=trueup_app
spring.datasource.password=${POSTGRES_PASSWORD}

trueup.jwt.secret=${JWT_SECRET}
trueup.jwt.ttl-seconds=3600

trueup.events.worker.enabled=false
trueup.events.worker.poll-interval-ms=5000
trueup.events.worker.lease-seconds=300

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false